<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Dileep Kumar Kalisetti</title>
<style>
  :root {
    --bg: #14212C;
    --panel: #0d161d;
    --text: #d7e0e6;
    --dim: #6b7d89;
    --accent: #34d399;
    --error: #f87171;
    --border: #24343f;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "SFMono-Regular", Menlo, Consolas, "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .terminal {
    width: 100%;
    max-width: 620px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    overflow: hidden;
  }
  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: #101c24;
    border-bottom: 1px solid var(--border);
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.red { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green { background: #27c93f; }
  .titlebar .label {
    margin-left: 8px;
    color: var(--dim);
    font-size: 13px;
  }
  .body {
    padding: 22px 24px 26px;
    font-size: 14px;
    line-height: 1.7;
  }
  .line { white-space: pre-wrap; word-break: break-word; }
  .prompt { color: var(--accent); }
  .path { color: #7dd3fc; }
  .err { color: var(--error); }
  .muted { color: var(--dim); }
  .big { font-size: 15px; margin: 14px 0 4px; color: var(--text); }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: var(--accent);
    vertical-align: -3px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }
  .actions {
    margin-top: 20px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-block;
    padding: 9px 16px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
    border: 1px solid var(--border);
  }
  .btn.primary {
    background: var(--accent);
    color: #062b17;
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn.secondary { color: var(--text); }
  .btn:hover { filter: brightness(1.08); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="terminal">
    <div class="titlebar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="label">dileep@prod: ~/portfolio</span>
    </div>
    <div class="body">
      <div class="line"><span class="prompt">dileep@prod:~$</span> cd "<span class="path" id="reqPath">this-page</span>"</div>
      <div class="line err">bash: cd: <span id="reqPath2">this-page</span>: No such file or directory</div>
      <div class="line">&nbsp;</div>
      <div class="line big"><span class="prompt">dileep@prod:~$</span> ./status --code 404</div>
      <div class="line">404 — page not found on this deployment.</div>
      <div class="line muted">The route you requested doesn't exist, or it moved.</div>
      <div class="line">&nbsp;</div>
      <div class="line"><span class="prompt">dileep@prod:~$</span> <span class="cursor"></span></div>
      <div class="actions">
        <a class="btn primary" href="https://dileepkumar-bit.github.io/">cd ~ (back to home)</a>
        <a class="btn secondary" href="https://github.com/dileepkumar-bit">view GitHub</a>
      </div>
    </div>
  </div>
  <script>
    try {
      var p = window.location.pathname.replace(/^\/|\/$/g, '') || 'this-page';
      var full = '/' + p;
      document.getElementById('reqPath').textContent = full;
      document.getElementById('reqPath2').textContent = full;
    } catch (e) {}
  </script>
</body>
</html>
